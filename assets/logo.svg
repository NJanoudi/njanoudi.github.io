<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neon" x1="14" y1="14" x2="82" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7CFFCB"></stop>
      <stop offset="1" stop-color="#7AA7FF"></stop>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Arcade badge background -->
  <rect x="8" y="8" width="80" height="80" rx="18" fill="#0E1220"></rect>
  <rect x="8" y="8" width="80" height="80" rx="18" stroke="url(#neon)" stroke-width="3"></rect>

  <!-- Pixel-style corner dots -->
  <rect x="20" y="20" width="5" height="5" fill="#7CFFCB" opacity="0.8"></rect>
  <rect x="71" y="20" width="5" height="5" fill="#7AA7FF" opacity="0.8"></rect>
  <rect x="20" y="71" width="5" height="5" fill="#7AA7FF" opacity="0.8"></rect>

  <!-- Terminal prompt -->
  <path d="M24 41L34 48L24 55" stroke="#7CFFCB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"></path>

  <!-- NJ initials -->
  <text x="41" y="55" font-family="Consolas, Monaco, monospace" font-size="22" font-weight="700" fill="#F3F7FF">NJ</text>

  <!-- QA checkmark -->
  <path d="M57 70L65 77L78 61" stroke="#7CFFCB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"></path>
</svg>